syntax = "proto3";

package ping.v2;

// Same service as ping.proto, but every field is raw bytes.
// Integers are encoded by hand: 4-byte unsigned, big-endian (Python: int.to_bytes(4, "big")).
service Pinger {
  rpc Ping(PingRequest) returns (PingReply);                     // unary: 1 request -> 1 reply
  rpc PingClientStream(stream PingRequest) returns (PingReply);  // client streaming: many requests -> 1 reply
  rpc PingServerStream(PingRequest) returns (stream PingReply);  // server streaming: 1 request -> many replies
}

message PingRequest {
  bytes payload = 1;
  bytes count = 2;  // server streaming only: how many replies the server should send (uint32, big-endian)
}

message PingReply {
  bytes payload = 1;
  bytes count = 2;  // client streaming only: how many requests the server received (uint32, big-endian)
}
